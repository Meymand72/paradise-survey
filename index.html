<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>فرم نظرسنجی بازدید پارادیس</title>

  <!-- فونت فارسی -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #14151c 0, #050609 55%, #000000 100%);
      color: #f8f5ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-wrapper {
      width: 100%;
      max-width: 480px;
      padding: 16px;
    }

    .card {
      background: radial-gradient(circle at top, #19171f 0, #030307 65%);
      border-radius: 32px;
      padding: 28px 24px 24px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255, 214, 126, 0.18), transparent 60%);
      opacity: 0.8;
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .logo img {
      width: 76px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 16px rgba(255, 215, 128, 0.5));
    }

    .logo-title-main {
      font-size: 18px;
      letter-spacing: 0.18em;
      color: #f8d58a;
    }

    .logo-title-sub {
      font-size: 13px;
      color: #f0e6ff;
      opacity: 0.8;
    }

    .logo-caption {
      font-size: 11px;
      color: #c2b8ff;
      opacity: 0.8;
      margin-top: 2px;
    }

    .progress-container {
      margin: 18px 0 18px;
    }

    .progress-label {
      font-size: 11px;
      color: #d9d2ff;
      margin-bottom: 6px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f6d365, #fda085);
      transition: width 0.35s ease;
    }

    .question-counter {
      font-size: 11px;
      color: #d0c7ff;
      text-align: center;
      margin-bottom: 6px;
    }

    .question-title {
      font-size: 15px;
      font-weight: 500;
      color: #ffffff;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.7;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .options.scrollable {
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 999px;
      background: radial-gradient(circle at top left, #231b28 0, #0b0a0f 65%);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.1s ease,
        box-shadow 0.15s ease;
    }

    .option-label {
      font-size: 13px;
      color: #e7e1ff;
      flex: 1;
      margin-inline-end: 10px;
    }

    .option-bullet {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .option-bullet-inner {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: transparent;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .option.selected {
      background: radial-gradient(circle at top left, #3a2836 0, #151017 70%);
      border-color: #f5d37e;
      box-shadow:
        0 0 0 1px rgba(245, 211, 126, 0.35),
        0 12px 26px rgba(0, 0, 0, 0.85);
      transform: translateY(-1px);
    }

    .option.selected .option-bullet {
      border-color: rgba(245, 211, 126, 0.85);
    }

    .option.selected .option-bullet-inner {
      background: linear-gradient(135deg, #f6d365, #fda085);
      transform: scale(1.05);
    }

    .other-wrapper {
      margin-top: 8px;
      display: none;
    }

    .other-label {
      font-size: 11px;
      color: #d5c7ff;
      margin-bottom: 4px;
    }

    .other-input {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 10px;
      background: rgba(10, 9, 16, 0.85);
      color: #f8f5ff;
      font-size: 12px;
      outline: none;
    }

    .text-area-wrapper {
      margin-top: 6px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 10px 12px;
      background: rgba(10, 9, 16, 0.9);
      color: #f8f5ff;
      font-size: 12px;
      resize: vertical;
      outline: none;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .btn {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 11px 16px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: #201616;
      font-weight: 600;
    }

    .btn-secondary {
      background: radial-gradient(circle at top left, #1f1828 0, #050509 65%);
      color: #f5e7ff;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* پیام تشکر وسط */
    .thankyou-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffe4a0;
      text-align: center;
      margin-top: 24px;
      line-height: 1.9;
    }

    #thankyouScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 260px;
    }
  </style>
</head>

<body>
  <div class="app-wrapper">
    <div class="card">
      <div class="card-inner" id="surveyRoot">
        <div class="logo">
          <img src="logo_paradise.png" alt="لوگوی پارادایس" />
          <div class="logo-title-main">PARADISE</div>
          <div class="logo-title-sub">پارادیس</div>
          <div class="logo-caption">فرم نظرسنجی بازدید خصوصی پارادیس</div>
        </div>

        <div class="progress-container" id="progressSection">
          <div class="progress-label">بازخورد شما کمک می‌کند تجربه بازدیدهای بعدی بهتر شود</div>
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="question-wrapper" id="questionWrapper">
          <!-- سوال‌ها با جاوااسکریپت رندر می‌شود -->
        </div>

        <div class="error-box" id="errorBox"></div>

        <div class="buttons" id="buttonsRow">
          <button class="btn btn-secondary" id="prevBtn">قبلی</button>
          <button class="btn btn-primary" id="nextBtn">ادامه</button>
        </div>
      </div>

      <!-- صفحه تشکر -->
      <div class="card-inner" id="thankyouScreen" style="display: none;">
        <div class="logo">
          <img src="logo_paradise.png" alt="لوگوی پارادایس" />
          <div class="logo-title-main">PARADISE</div>
          <div class="logo-title-sub">پارادیس</div>
        </div>

        <div class="progress-bar">
          <div class="progress-fill" style="width: 100%;"></div>
        </div>

        <div class="thankyou-title">
          نظر شما با موفقیت ثبت شد<br />
          سپاس از اعتماد شما
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const questions = [
      {
        id: "رضایت کلی",
        title: "سؤال ۱ از ۸",
        text: "تجربه کلی شما از بازدید پارادیس را چگونه ارزیابی می‌کنید؟",
        type: "single",
        required: true,
        options: [
          "کمتر از انتظار",
          "قابل قبول",
          "خوب",
          "بسیار خوب",
          "فراتر از انتظار"
        ]
      },
      {
        id: "کیفیت پروژه",
        title: "سؤال ۲ از ۸",
        text: "کیفیت پروژه از نگاه شما چگونه بود؟",
        type: "single",
        required: true,
        options: [
          "بسیار عالی",
          "خوب",
          "قابل قبول",
          "کمتر از انتظار"
        ]
      },
      {
        id: "رفتار مشاور",
        title: "سؤال ۳ از ۸",
        text: "رفتار و همراهی تیم مشاوره چگونه بود؟",
        type: "single",
        required: true,
        options: [
          "نیاز به بهبود",
          "قابل قبول",
          "خوب",
          "بسیار حرفه‌ای",
          "بی‌نقص"
        ]
      },
      {
        id: "احتمال معرفی",
        title: "سؤال ۴ از ۸",
        text: "چقدر احتمال دارد پارادیس را به دیگران معرفی کنید؟",
        type: "single",
        required: true,
        options: [
          "اصلاً معرفی نمی‌کنم",
          "احتمال کم",
          "احتمال متوسط",
          "احتمال زیاد",
          "قطعاً معرفی می‌کنم"
        ]
      },
      {
        id: "ویژگی های مورد علاقه",
        title: "سؤال ۵ از ۸",
        text: "ویژگی‌های مورد علاقه شما چه بودند؟ (حداکثر ۳ مورد)",
        type: "multi",
        maxSelection: 3,
        scrollable: true,
        required: true,
        helper: "می‌توانید تا ۳ گزینه را انتخاب کنید.",
        options: [
          "ویو",
          "نورگیری",
          "پلان",
          "متریال و فینیشینگ",
          "امکانات پروژه",
          "موقعیت کوهستانی",
          "آرامش و سکوت",
          "محوطه",
          "امنیت",
          "سایر"
        ],
        otherLabel: "اگر مورد دیگری برای شما مهم بود، لطفاً بنویسید:"
      },
      {
        id: "نگرانی اصلی",
        title: "سؤال ۶ از ۸",
        text: "مهم‌ترین نگرانی یا عامل تردید شما چیست؟ (یک مورد)",
        type: "single",
        scrollable: true,
        required: true,
        options: [
          "قیمت",
          "شرایط پرداخت",
          "متراژ",
          "پلان",
          "طبقه / موقعیت",
          "امکانات پروژه",
          "امنیت",
          "کیفیت فضاهای مشترک",
          "فاصله تا مدرسه فرزندان",
          "فاصله تا محل کار",
          "نیازهای روزمره / مراکز خرید",
          "زمان تحویل",
          "وضعیت ساخت",
          "سایر"
        ],
        otherLabel: "اگر مورد دیگری مدنظر شماست، لطفاً بنویسید:"
      },
      {
        id: "مرحله بعدی",
        title: "سؤال ۷ از ۸",
        text: "مرحله بعدی را چگونه ترجیح می‌دهید؟",
        type: "single",
        required: true,
        options: [
          "هماهنگی بازدید دوم",
          "جلسه مشاوره فروش",
          "ارسال پلان‌ها و اطلاعات",
          "فعلاً نیاز به زمان دارم"
        ]
      },
      {
        id: "توضیحات مشتری",
        title: "سؤال ۸ از ۸",
        text: "اگر نکته، پیشنهاد یا انتقادی دارید بفرمایید:",
        type: "text",
        required: false
      }
    ];

    let currentIndex = 0;
    const answers = {};
    const extraFields = {};

    const questionWrapper = document.getElementById("questionWrapper");
    const errorBox = document.getElementById("errorBox");
    const progressFill = document.getElementById("progressFill");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const surveyRoot = document.getElementById("surveyRoot");
    const thankyouScreen = document.getElementById("thankyouScreen");
    const toastEl = document.getElementById("toast");

    const urlParams = new URLSearchParams(window.location.search);
    const bookingId =
      urlParams.get("BookingID") ||
      urlParams.get("bookingId") ||
      urlParams.get("bookingID") ||
      "";

    function renderQuestion(index) {
      const q = questions[index];
      questionWrapper.innerHTML = "";

      const slide = document.createElement("div");
      slide.className = "slide active";

      const counter = document.createElement("div");
      counter.className = "question-counter";
      counter.textContent = q.title;
      slide.appendChild(counter);

      const title = document.createElement("div");
      title.className = "question-title";
      title.textContent = q.text;
      slide.appendChild(title);

      if (q.type === "single" || q.type === "multi") {
        if (q.helper) {
          const helper = document.createElement("div");
          helper.className = "option-helper";
          helper.textContent = q.helper;
          slide.appendChild(helper);
        }

        const optionsContainer = document.createElement("div");
        optionsContainer.className = "options";
        if (q.scrollable) {
          optionsContainer.classList.add("scrollable");
        }

        q.options.forEach((optText) => {
          const optionEl = document.createElement("div");
          optionEl.className = "option";
          optionEl.dataset.value = optText;

          const label = document.createElement("div");
          label.className = "option-label";
          label.textContent = optText;

          const bullet = document.createElement("div");
          bullet.className = "option-bullet";
          const bulletInner = document.createElement("div");
          bulletInner.className = "option-bullet-inner";
          bullet.appendChild(bulletInner);

          optionEl.appendChild(label);
          optionEl.appendChild(bullet);

          const prevAnswer = answers[q.id];
          if (q.type === "single" && prevAnswer === optText) {
            optionEl.classList.add("selected");
          } else if (q.type === "multi" && Array.isArray(prevAnswer) && prevAnswer.includes(optText)) {
            optionEl.classList.add("selected");
          }

          optionEl.addEventListener("click", () => handleOptionClick(q, optionEl, optionsContainer));
          optionsContainer.appendChild(optionEl);
        });

        slide.appendChild(optionsContainer);

        if (q.otherLabel) {
          const otherWrapper = document.createElement("div");
          otherWrapper.className = "other-wrapper";

          const otherLabel = document.createElement("div");
          otherLabel.className = "other-label";
          otherLabel.textContent = q.otherLabel;

          const otherInput = document.createElement("input");
          otherInput.className = "other-input";
          otherInput.type = "text";
          otherInput.placeholder = "اینجا بنویسید...";
          otherInput.value = extraFields[q.id + "_other"] || "";

          otherInput.addEventListener("input", () => {
            extraFields[q.id + "_other"] = otherInput.value.trim();
            updateNextButtonState();  /* مهم */
          });

          otherWrapper.appendChild(otherLabel);
          otherWrapper.appendChild(otherInput);
          slide.appendChild(otherWrapper);
        }
      }
      else if (q.type === "text") {
        const textWrapper = document.createElement("div");
        textWrapper.className = "text-area-wrapper";

        const textarea = document.createElement("textarea");
        textarea.placeholder = "می‌توانید هر نکته‌ای که به ذهن‌تان می‌رسد اینجا بنویسید...";
        textarea.value = answers[q.id] || "";

        textarea.addEventListener("input", () => {
          answers[q.id] = textarea.value.trim();
          updateNextButtonState();
        });

        textWrapper.appendChild(textarea);
        slide.appendChild(textWrapper);

        const helper = document.createElement("div");
        helper.className = "helper-optional";
        helper.textContent = "پاسخ به این سوال اختیاری است.";
        slide.appendChild(helper);
      }

      questionWrapper.appendChild(slide);
      prevBtn.style.visibility = index === 0 ? "hidden" : "visible";
      nextBtn.textContent = index === questions.length - 1 ? "ثبت و پایان" : "ادامه";

      updateProgress();
      updateNextButtonState();
      errorBox.textContent = "";

      toggleOtherUI(q);
    }


    function handleOptionClick(q, optionEl, container) {
      if (q.type === "single") {
        container.querySelectorAll(".option").forEach((opt) => opt.classList.remove("selected"));
        optionEl.classList.add("selected");
        answers[q.id] = optionEl.dataset.value;

        updateNextButtonState();
        toggleOtherUI(q);

        if (q.id !== "ویژگی های مورد علاقه" && q.id !== "نگرانی اصلی") {
          setTimeout(() => {
            goNext();
          }, 200);
        }
      }

      else if (q.type === "multi") {
        const currentlySelected = Array.from(container.querySelectorAll(".option.selected")).map(
          (el) => el.dataset.value
        );

        const value = optionEl.dataset.value;
        let newSelected;

        if (optionEl.classList.contains("selected")) {
          newSelected = currentlySelected.filter((v) => v !== value);
          optionEl.classList.remove("selected");
        } else {
          if (currentlySelected.length >= q.maxSelection && value !== "سایر") {
            showToast("حداکثر می‌توانید " + q.maxSelection + " گزینه انتخاب کنید.");
            return;
          }
          optionEl.classList.add("selected");
          newSelected = [...currentlySelected, value];
        }

        answers[q.id] = newSelected;
        updateNextButtonState();
        toggleOtherUI(q);
      }
    }


    function toggleOtherUI(q) {
      const slide = questionWrapper.querySelector(".slide.active");
      if (!slide || !q.otherLabel) return;

      const otherWrapper = slide.querySelector(".other-wrapper");
      const otherInput = slide.querySelector(".other-input");

      if (!otherWrapper || !otherInput) return;

      const ans = answers[q.id];
      let hasOtherSelected = false;

      if (q.type === "single") {
        hasOtherSelected = ans === "سایر";
      } else if (q.type === "multi") {
        hasOtherSelected = Array.isArray(ans) && ans.includes("سایر");
      }

      if (hasOtherSelected) {
        otherWrapper.style.display = "block";

        setTimeout(() => {
          otherWrapper.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 50);

        otherInput.value = extraFields[q.id + "_other"] || "";
      } else {
        otherWrapper.style.display = "none";
        otherInput.value = "";
        extraFields[q.id + "_other"] = "";
      }
    }


    function updateProgress() {
      const percent = (currentIndex / questions.length) * 100;
      progressFill.style.width = `${percent}%`;
    }


    function updateNextButtonState() {
      const q = questions[currentIndex];
      if (!q) return;

      if (q.type === "text" && !q.required) {
        nextBtn.disabled = false;
        return;
      }

      if (q.type === "single") {
        const val = answers[q.id];
        const otherRequired =
          q.otherLabel &&
          val === "سایر" &&
          (!extraFields[q.id + "_other"] || extraFields[q.id + "_other"].trim() === "");

        nextBtn.disabled = !val || otherRequired;
      }

      else if (q.type === "multi") {
        const arr = answers[q.id];
        const hasAny = Array.isArray(arr) && arr.length > 0;
        const hasOther = hasAny && arr.includes("سایر");

        const otherRequired =
          hasOther &&
          q.otherLabel &&
          (!extraFields[q.id + "_other"] || extraFields[q.id + "_other"].trim() === "");

        nextBtn.disabled = !hasAny || otherRequired;
      }

      else {
        nextBtn.disabled = false;
      }
    }


    function validateCurrentQuestion() {
      const q = questions[currentIndex];
      if (!q) return true;

      if (!q.required) return true;

      if (q.type === "single") {
        const val = answers[q.id];
        if (!val) {
          errorBox.textContent = "لطفاً یک گزینه انتخاب کنید.";
          return false;
        }

        if (val === "سایر" && q.otherLabel) {
          const txt = (extraFields[q.id + "_other"] || "").trim();
          if (!txt) {
            errorBox.textContent = "لطفاً توضیح گزینه سایر را بنویسید.";
            return false;
          }
        }
      }

      else if (q.type === "multi") {
        const arr = answers[q.id];
        if (!Array.isArray(arr) || arr.length === 0) {
          errorBox.textContent = "لطفاً حداقل یک گزینه انتخاب کنید.";
          return false;
        }

        if (arr.includes("سایر") && q.otherLabel) {
          const txt = (extraFields[q.id + "_other"] || "").trim();
          if (!txt) {
            errorBox.textContent = "لطفاً توضیح گزینه سایر را بنویسید.";
            return false;
          }
        }
      }

      else if (q.type === "text" && q.required) {
        const txt = (answers[q.id] || "").trim();
        if (!txt) {
          errorBox.textContent = "لطفاً این بخش را بنویسید.";
          return false;
        }
      }

      errorBox.textContent = "";
      return true;
    }


    function goNext() {
      const q = questions[currentIndex];
      if (!q) return;

      if (!validateCurrentQuestion()) return;

      if (currentIndex === questions.length - 1) {
        submitSurvey();
        return;
      }

      currentIndex++;
      renderQuestion(currentIndex);
    }


    function goPrev() {
      if (currentIndex === 0) return;
      currentIndex--;
      renderQuestion(currentIndex);
    }


    prevBtn.addEventListener("click", goPrev);

    nextBtn.addEventListener("click", () => {
      if (!validateCurrentQuestion()) return;
      goNext();
    });


    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("visible");

      setTimeout(() => {
        toastEl.classList.remove("visible");
      }, 2500);
    }


    async function submitSurvey() {
      const payload = {
        BookingID: bookingId,
        "رضایت کلی": answers["رضایت کلی"] || "",
        "کیفیت پروژه": answers["کیفیت پروژه"] || "",
        "رفتار مشاور": answers["رفتار مشاور"] || "",
        "احتمال معرفی": answers["احتمال معرفی"] || "",
        "ویژگی های مورد علاقه": Array.isArray(answers["ویژگی های مورد علاقه"])
          ? answers["ویژگی های مورد علاقه"].join("، ")
          : "",
        "سایر ویژگی ها": extraFields["ویژگی های مورد علاقه_other"] || "",
        "نگرانی اصلی": answers["نگرانی اصلی"] || "",
        "سایر نگرانی ها": extraFields["نگرانی اصلی_other"] || "",
        "مرحله بعدی": answers["مرحله بعدی"] || "",
        "توضیحات مشتری": answers["توضیحات مشتری"] || ""
      };

      const WEBHOOK_URL = "https://meymand72.app.n8n.cloud/webhook/paradise-feedback";

      try {
        if (WEBHOOK_URL) {
          await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });
        }
      } catch (e) {
        console.error("خطا در ارسال به وب‌هوک:", e);
      }

      surveyRoot.style.display = "none";
      thankyouScreen.style.display = "block";
    }

    renderQuestion(currentIndex);
  </script>

</body>
